name: CI/CD → Render Deploy

on:
  push:
    branches: [master]      # sizning branch nomingiz
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ─── JOB 1: Backend Test ────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Django Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: studytracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "test-secret-key-only-for-ci-not-production"
      DEBUG: "False"
      POSTGRES_DB: studytracker_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: study_tracker/requirements*.txt

      - name: 📦 Install dependencies
        working-directory: study_tracker
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 🗄️ Run migrations
        working-directory: study_tracker
        run: python manage.py migrate --noinput

      - name: ✅ Run tests
        working-directory: study_tracker
        run: python manage.py test --verbosity=2

  # ─── JOB 2: Frontend Build Test ─────────────────────────────────────────────
  test-frontend:
    name: 🏗️ Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build
        working-directory: frontend
        env:
          VITE_API_URL: https://your-app.onrender.com
        run: npm run build

  # ─── JOB 3: Docker Build & Push ─────────────────────────────────────────────
  build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🚀 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/study-tracker-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/study-tracker-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 4: Deploy to Render ────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: 🚀 Trigger Render Deploy (Backend)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -d '{"clearCache": false}'

      - name: ✅ Deploy triggered
        run: echo "Deploy muvaffaqiyatli boshlandi! https://dashboard.render.com"
