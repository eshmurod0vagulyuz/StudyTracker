services:
  # ─── Django Backend ──────────────────────────────────────────────────────────
  - type: web
    name: study-tracker-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    branch: master
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: ".onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: study-tracker-db
          property: connectionString

      # PostgreSQL env vars (settings.py da o'qiladi)
      - key: POSTGRES_DB
        fromDatabase:
          name: study-tracker-db
          property: database

      - key: POSTGRES_USER
        fromDatabase:
          name: study-tracker-db
          property: user

      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: study-tracker-db
          property: password

      - key: POSTGRES_HOST
        fromDatabase:
          name: study-tracker-db
          property: host

      - key: POSTGRES_PORT
        fromDatabase:
          name: study-tracker-db
          property: port

  # ─── React Frontend (Static Site) ────────────────────────────────────────────
  - type: web
    name: study-tracker-frontend
    runtime: static
    staticPublishPath: ./frontend/dist
    branch: master
    autoDeploy: true

    buildCommand: cd frontend && npm ci && npm run build

    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://study-tracker-backend.onrender.com

# ─── PostgreSQL Database ───────────────────────────────────────────────────────
databases:
  - name: study-tracker-db
    plan: free
    databaseName: studytracker
    user: studytracker_user
    postgresMajorVersion: 16
